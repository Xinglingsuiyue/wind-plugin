master_battled: true #主人是否会被别人攻打
master_cd: false #主人是否需要cd
cdtime_battle: 2 #决斗的冷却时间,单位为分钟
d1_battle: 30  #低等级打高等级，且都为凡境相差两个大境界时,事先扣除的低境界的灵力
d2_battle: 40  #低等级打高等级，且都为仙境相差两个大境界时,事先扣除的低境界的灵力
d3_battle: 40  #低等级打高等级，拥有仙凡之隔,事先扣除的低境界的灵力
d4_battle: 50  #低等级打高等级，低等级为大帝之下,高等级为大帝之上时,事先扣除的低境界的灵力
beclear: 0.05      #低打高被废掉的概率
toclear: 0.02     #高打低打废低等级的概率